      <stop offset="1" stop-color="#713c20"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".83"/>
      <stop offset="1" stop-color="#e8f6f4" stop-opacity=".45"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="10" dy="16" stdDeviation="15" flood-color="#85562f" flood-opacity=".2"/>
