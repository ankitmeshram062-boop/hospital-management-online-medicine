<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Cough syrup</title>
  <desc id="desc">An amber bottle of cough syrup with a measuring cup.</desc>
  <defs>
