      <stop offset="0" stop-color="#fff3e7"/>
      <stop offset="1" stop-color="#fffaf4"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#713c20"/>
