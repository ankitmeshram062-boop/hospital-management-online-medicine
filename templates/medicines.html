{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="section-title">Medicine Store</h1></div>
<form class="row g-2 mb-4"><div class="col-md-7"><input class="form-control" name="q" value="{{q}}" placeholder="Search products"></div>
<div class="col-md-3"><select class="form-select" name="category"><option value="">All categories</option>{% for c in categories %}<option {% if c==category %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div></form>
<div class="row g-4">{% for p in products %}<div class="col-md-4 col-lg-3"><div class="card h-100">
<img src="{{p.image}}" class="product-img" onerror="this.style.display='none'"><div class="card-body"><span class="badge text-bg-light">{{p.category}}</span><h5 class="mt-2">{{p.name}}</h5>
<p class="small text-muted">{{p.description}}</p><div class="d-flex justify-content-between align-items-center"><span class="price">₹{{p.price}}</span>
<a class="btn btn-sm btn-primary" href="{{url_for('medicine_detail',id=p.id)}}">View</a></div></div></div></div>
{% else %}<p>No products found.</p>{% endfor %}</div>{% endblock %}
