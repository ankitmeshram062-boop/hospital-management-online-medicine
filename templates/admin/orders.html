{% extends 'base.html' %}{% block content %}<h1>Manage Orders</h1><table class="table"><tr><th>Order</th><th>Patient</th><th>Total</th><th>Current Status</th><th>Update</th></tr>
{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.patient}}</td><td>₹{{o.total_amount}}</td><td>{{o.status}}</td><td><form method="post" action="{{url_for('admin_order_status',id=o.id)}}" class="d-flex gap-2"><select class="form-select" name="status">{% for s in ['Pending','Confirmed','Shipped','Delivered','Cancelled'] %}<option {% if s==o.status %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button class="btn btn-primary">Save</button></form></td></tr>{% endfor %}</table>{% endblock %}
