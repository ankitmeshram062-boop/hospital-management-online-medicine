{% extends 'base.html' %}{% block content %}<h1 class="section-title">My Orders</h1><div class="table-responsive"><table class="table"><tr><th>Order</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr>
{% for o in orders %}<tr><td>#{{o.id}}</td><td>₹{{o.total_amount}}</td><td>{{o.payment_method}}</td><td><span class="badge text-bg-primary">{{o.status}}</span></td><td>{{o.created_at}}</td></tr>{% else %}<tr><td colspan="5">No orders yet.</td></tr>{% endfor %}</table></div>{% endblock %}
