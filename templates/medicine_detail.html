{% extends 'base.html' %}{% block content %}<div class="row g-5"><div class="col-md-5"><img src="{{product.image}}" class="img-fluid rounded-4 shadow" onerror="this.style.display='none'"></div>
<div class="col-md-7"><span class="badge text-bg-primary">{{product.category}}</span><h1>{{product.name}}</h1><p>{{product.description}}</p><h2 class="price">₹{{product.price}}</h2><p>Available stock: {{product.stock}}</p>
{% if product.stock>0 %}<form action="{{url_for('cart_add',id=product.id)}}" class="d-flex gap-2"><input class="form-control" style="max-width:100px" type="number" name="qty" value="1" min="1" max="{{product.stock}}"><button class="btn btn-primary">Add to Cart</button></form>{% else %}<button class="btn btn-secondary" disabled>Out of Stock</button>{% endif %}
</div></div>{% endblock %}
